name: Action History Gegenprobe

on:
  push:
    paths:
      - "tools/action_history/**"
      - ".github/workflows/action-history.yml"
  pull_request:
    paths:
      - "tools/action_history/**"
      - ".github/workflows/action-history.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/action_history/requirements.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install -r tools/action_history/requirements.txt

      - name: Syntax vollständig prüfen
        run: python -m compileall -q tools/action_history

      - name: Gegnerische Tests ausführen
        run: python -m pytest -q tools/action_history/tests

      - name: Installationsprobe ausführen
        run: python -m tools.action_history.verify_install

      - name: Werkzeugkörper in echtem FastMCP prüfen
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          isolated_root = Path(tempfile.mkdtemp(prefix="action-history-ci-"))
          os.environ["FLEXTRAWURST_ACTION_HISTORY"] = str(isolated_root / "history.jsonl")
          os.environ["FLEXTRAWURST_HISTORY_ALLOWED_ROOTS"] = str(isolated_root)

          from mcp.server.fastmcp import FastMCP
          from tools.action_history import ActionHistory, TrackedFileOps
          from tools.action_history.toolset import REQUIRED_TOOLS, register_action_history_tools

          history = ActionHistory(isolated_root / "history.jsonl", actor="GPT-5.6-sol-hoch")
          files = TrackedFileOps(history)
          server = FastMCP("action-history-ci")
          registered = register_action_history_tools(server, history=history, files=files)

          actual = tuple(registered)
          if actual != REQUIRED_TOOLS:
              raise SystemExit(
                  f"Werkzeugvertrag abweichend; erwartet={REQUIRED_TOOLS!r} erhalten={actual!r}"
              )
          print(f"Echter FastMCP hat alle {len(REQUIRED_TOOLS)} Werkzeuge registriert")
          PY
