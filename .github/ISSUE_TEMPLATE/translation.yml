name: Translation note / Übersetzungshinweis
description: Suggest a translation correction or bilingual wording improvement.
title: "[TRANSLATION] "
labels: ["translation", "documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ## English
        Use this template for translation corrections, bilingual wording improvements or unclear German/English terms.

        ## Deutsch
        Nutze dieses Template für Übersetzungskorrekturen, zweisprachige Formulierungen oder unklare deutsch/englische Begriffe.

  - type: input
    id: location
    attributes:
      label: Location / Ort
      description: File, URL, heading or sentence.
      placeholder: README.md / docs/... / https://flextrawurst.de/...
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current wording / Aktuelle Formulierung
      description: Paste the current wording.
      placeholder: Current text...
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording / Vorgeschlagene Formulierung
      description: Paste your suggested correction.
      placeholder: Suggested text...
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language direction / Sprachrichtung
      options:
        - English improvement
        - Deutsche Verbesserung
        - German ↔ English consistency
        - Term clarification / Begriffsklärung
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: Reason / Begründung
      description: Why is the suggested wording better?
      placeholder: This is clearer because...
    validations:
      required: false
